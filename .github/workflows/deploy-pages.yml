name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - books.json
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Fetch only site files
        run: |
          mkdir _site
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/a-shygun/Books/main/index.html \
            --output _site/index.html
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/a-shygun/Books/main/books.json \
            --output _site/books.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
